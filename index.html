    <script>
      // Capture beforeinstallprompt immediately on page load before React initializes
      window.__pwaInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-available', { detail: e }));
      });

      // Self-healing: Unregister conflicting or broken sw.js only on local development server
      if ('serviceWorker' in navigator && (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (var i = 0; i < registrations.length; i++) {
            if (registrations[i].active && registrations[i].active.scriptURL.includes('sw.js')) {
              registrations[i].unregister();
            }
          }
        }).catch(function () {});
      }
    </script>
  </head>
